<!DOCTYPE html>
<html>
<head>
    <title>NY</title>
    <script src="https://cdnjs.cloudflare.com"></script>
</head>
<body style="margin:0; background: black;">
    <script>
        function setup() {
            createCanvas(windowWidth, windowHeight);
        }
        function draw() {
            background(0, 10, 26);
            fill(255);
            textSize(32);
            textAlign(CENTER, CENTER);
            text("🎄 Елочка горит!", width/2, height/2);
            
            fill(255, 204, 0);
            ellipse(mouseX, mouseY, 50, 50); // Желтый круг за мышкой
        }
    </script>
</body>
</html>
