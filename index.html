<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com"></script>
    <style> body { margin: 0; overflow: hidden; } </style>
</head>
<body>
<script>
let flakes = [];
let frame = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  for (let i = 0; i < 60; i++) {
    flakes.push({x: random(width), y: random(height), dy: random(1, 3)});
  }
}

function draw() {
  background("#000a1a");
  frame++;

  // 1. Луна
  fill("#fff9c4");
  noStroke();
  let moonSize = 70 + sin(frame * 0.1) * 5;
  ellipse(70, 70, moonSize);

  // 2. Сани
  textSize(30);
  let sleighX = width - (frame * 3 % (width + 200));
  text("🦌🛷💨", sleighX, 80);

  // 3. Елка
  fill("#3d2b1f"); // Ствол
  rect(width/2 - 15, height - 100, 30, 40);
  fill("#004d1a"); // Хвоя
  triangle(width/2-100, height-100, width/2+100, height-100, width/2, height-250);
  triangle(width/2-80, height-180, width/2+80, height-180, width/2, height-300);
  
  // 4. Звезда (мигающая)
  fill(frame % 20 < 10 ? "gold" : "white");
  push();
  translate(width/2, height-310);
  rotate(PI);
  triangle(-15, -15, 15, -15, 0, 15);
  pop();

  // 5. Снег
  fill(255);
  for (let f of flakes) {
    ellipse(f.x, f.y, 3);
    f.y += f.dy;
    if (f.y > height) f.y = -10;
  }
}
</script>
</body>
</html>
